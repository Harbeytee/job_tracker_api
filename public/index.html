<!doctype html>
<html>
  <head>
    <title>Google Auth Test</title>
    <script src="/env.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <h1>Hello, TypeScript + Node.js + Express!</h1>

    <!-- Buttons to trigger Google Sign Up or Sign In -->
    <button onclick="authenticate('sign_up')">Sign up with Google</button>
    <button onclick="authenticate('sign_in')">Sign in with Google</button>
    <a
      href="https://res.cloudinary.com/dczc9zaeu/raw/upload/v1751232522/cover_letters/cover_letter_545c7b40-1534-4dda-b3e7-07719d2657a9.docx"
      download="My_Cover_Letter.docx"
      >download cover letter</a
    >

    <script>
      const config = window.__ENV__;
      const client_id = config?.google?.clientId;
      const baseUrl = config?.baseUrl;

      function authenticate(action) {
        if (!config) {
          console.error("Config not loaded yet.");
          return;
        }
        window.google.accounts.oauth2
          .initCodeClient({
            client_id,
            scope: "openid email profile",
            ux_mode: "popup",
            callback: (response) => handleAuthCodeResponse(response, action),
          })
          .requestCode();
      }

      function handleAuthCodeResponse(response, action) {
        fetch(`${baseUrl}/auth/google`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ code: response.code, action }),
        })
          .then((res) => res.json())
          .then((data) => console.log(data))
          .catch((err) => console.error("Error sending code to server:", err));
      }
    </script>
  </body>
</html>
